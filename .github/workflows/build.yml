name: Build & Release APK

on:
  push:
    branches: [ main ]
    tags:     [ 'v*' ]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      # Génère (ou restaure) un keystore stable depuis les secrets GitHub
      - name: Setup signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > app/keystore.jks
            echo "✅ Keystore restored from secret"
          else
            # Premier run : générer un keystore et afficher le base64 à copier dans les secrets
            keytool -genkeypair -v \
              -keystore app/keystore.jks \
              -alias tcs \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass android -keypass android \
              -dname "CN=TCS Calendar, OU=App, O=ICS-Calendar, L=BE, ST=BE, C=BE"
            echo "⚠️ Keystore generated — add this as KEYSTORE_BASE64 secret:"
            base64 -w 0 app/keystore.jks
            echo ""
          fi

      - name: Build APK
        env:
          KEYSTORE_PATH: keystore.jks
          KEYSTORE_PASSWORD: android
          KEY_ALIAS: tcs
          KEY_PASSWORD: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Rename APK
        run: |
          VERSION=$(grep versionName app/build.gradle | grep -o '"[^"]*"' | tr -d '"')
          cp app/build/outputs/apk/debug/app-debug.apk TCS.Calendar.apk
          echo "APK_VERSION=$VERSION" >> $GITHUB_ENV

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: TCS-Calendar-${{ env.APK_VERSION }}
          path: TCS.Calendar.apk
          retention-days: 90

      # Créer une Release GitHub automatiquement si c'est un tag v*
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: TCS.Calendar.apk
          name: "Release ${{ env.APK_VERSION }}"
          body: |
            ## TCS Calendar ${{ env.APK_VERSION }}
            
            Téléchargez et installez `TCS.Calendar.apk` directement.
            La mise à jour s'installe par-dessus l'ancienne version sans désinstallation.
